{% extends "encyclopedia/layout.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block body %}
<h1>All Pages</h1>

<ul>
    {% for entry in entries %}
    <a href="{% url 'encyclopedia:entry_page' entry %}">
        <li class="list-group-item">

            {{ entry }}
        </li>
    </a>
    {% endfor %}
</ul>

{% endblock %}
