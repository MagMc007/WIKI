{% extends "encyclopedia/layout.html" %}

{% block title %}
{{ page_title }}
{% endblock %}


{% block body %}
<h1 style="text-align: center;">{{ page_title }}</h1>
<form action="{% url 'encyclopedia:save_page' page_title %}" method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
